name: Publish atlas to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build territorial data
        run: npm run build
      - name: Verify atlas
        run: npm run check
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static atlas
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
