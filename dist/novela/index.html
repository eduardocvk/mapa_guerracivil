<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atlas histórico y literario · Mapa unificado</title>
<script>
const previous=new URLSearchParams(location.search),target=new URL('../',location.href);
target.searchParams.set('novela','1');
const person=previous.get('personaje');
if(['odisto','jose','pablito','angeles','jacobo','angel'].includes(person))target.searchParams.set('personajes',person);
const part=Number(previous.get('parte')??3);
target.searchParams.set('parte',Number.isFinite(part)?Math.max(0,Math.min(4,Math.trunc(part))):3);
location.replace(target.href);
</script></head><body><p>Los recorridos de la novela y el atlas histórico están ahora en el mismo mapa.</p><a href="../?novela=1">Abrir el mapa unificado</a></body></html>
